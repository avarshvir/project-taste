<!-- =========================================================================
     Project Taste — tools/password.html
     Secure password generator with an entropy-based strength meter.

     Fragment injected by router.js. TasteTools contract:
         window.TasteTools['password'] = function (root, tool, Taste){...}

     Security notes:
       - All randomness comes from crypto.getRandomValues (CSPRNG). We use
         rejection sampling to avoid modulo bias when mapping bytes to the
         character pool, so every character is uniformly distributed.
       - Strength is measured as Shannon entropy = length * log2(poolSize),
         which reflects real guess-resistance rather than arbitrary rules.
     ========================================================================= -->

<div class="tool-header">
  <div class="tool-header-icon"><i class="bi bi-shield-lock"></i></div>
  <div class="tool-header-text">
    <h1>Password Generator</h1>
    <p>Generate strong, unbiased passwords using your browser's cryptographic RNG — with a real entropy strength meter. Nothing is sent anywhere.</p>
  </div>
</div>

<div class="tool-card-panel">
  <!-- length -->
  <div class="field">
    <label class="field-label" for="pw-length">Length: <strong id="pw-lenval">20</strong> characters</label>
    <input type="range" id="pw-length" class="pw-range" min="4" max="128" value="20">
  </div>

  <!-- character set options -->
  <div class="toolbar">
    <label class="check-inline"><input type="checkbox" id="pw-upper" checked> A–Z</label>
    <label class="check-inline"><input type="checkbox" id="pw-lower" checked> a–z</label>
    <label class="check-inline"><input type="checkbox" id="pw-digit" checked> 0–9</label>
    <label class="check-inline"><input type="checkbox" id="pw-symbol" checked> !@#$…</label>
    <label class="check-inline" title="Avoid look-alike characters like O/0 and l/1"><input type="checkbox" id="pw-noambig"> No ambiguous</label>
  </div>

  <div class="toolbar">
    <label class="field-label" for="pw-count" style="margin:0 var(--sp-2) 0 0">Quantity</label>
    <input type="number" id="pw-count" class="input-taste" style="width:80px" min="1" max="100" value="1">
    <button class="btn-taste btn-taste-primary" data-act="generate"><i class="bi bi-arrow-repeat"></i> Generate</button>
    <button class="btn-taste btn-taste-success" data-act="copyall"><i class="bi bi-clipboard-check"></i> Copy All</button>
    <button class="btn-taste btn-taste-secondary" data-act="download"><i class="bi bi-download"></i> Download</button>
  </div>

  <!-- strength meter (reflects the current settings) -->
  <div class="pw-strength" id="pw-strength">
    <div class="pw-bar"><span id="pw-bar-fill"></span></div>
    <div class="pw-strength-label" id="pw-strength-label"></div>
  </div>

  <ul class="result-list" id="pw-results"></ul>
</div>

<style>
  .pw-range { width:100%; accent-color:var(--accent); height:6px; cursor:pointer; }
  .pw-strength { margin:var(--sp-4) 0; }
  .pw-bar { height:8px; background:var(--bg-subtle); border:1px solid var(--border); border-radius:var(--radius-full); overflow:hidden; }
  .pw-bar span { display:block; height:100%; width:0; border-radius:var(--radius-full);
    transition:width var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease); }
  .pw-strength-label { margin-top:var(--sp-2); font-size:var(--fs-sm); color:var(--text-muted);
    display:flex; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; }
  .pw-strength-label strong { color:var(--text); }
</style>

<script>
  window.TasteTools = window.TasteTools || {};
  window.TasteTools['password'] = function (root, tool, Taste) {
    'use strict';
    var $ = Taste.$, el = Taste.el;

    var lenEl   = $('#pw-length', root);
    var lenVal  = $('#pw-lenval', root);
    var upper   = $('#pw-upper', root);
    var lower   = $('#pw-lower', root);
    var digit   = $('#pw-digit', root);
    var symbol  = $('#pw-symbol', root);
    var noAmbig = $('#pw-noambig', root);
    var countEl = $('#pw-count', root);
    var results = $('#pw-results', root);
    var barFill = $('#pw-bar-fill', root);
    var strLabel= $('#pw-strength-label', root);

    var SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      digit: '0123456789',
      symbol: '!@#$%^&*()-_=+[]{};:,.<>?/'
    };
    var AMBIGUOUS = /[O0oIl1|`'"~,;.:]/g;

    function buildPool() {
      var pool = '';
      if (upper.checked)  pool += SETS.upper;
      if (lower.checked)  pool += SETS.lower;
      if (digit.checked)  pool += SETS.digit;
      if (symbol.checked) pool += SETS.symbol;
      if (noAmbig.checked) pool = pool.replace(AMBIGUOUS, '');
      // de-duplicate just in case
      return Array.from(new Set(pool.split(''))).join('');
    }

    /* ---- unbiased random index via rejection sampling ---- */
    function randIndex(max) {
      // smallest byte-count large enough; reject values in the biased tail
      var limit = Math.floor(256 / max) * max;
      var buf = new Uint8Array(1);
      var b;
      do { crypto.getRandomValues(buf); b = buf[0]; } while (b >= limit);
      return b % max;
    }

    function makeOne(pool, length) {
      var out = '';
      for (var i = 0; i < length; i++) out += pool.charAt(randIndex(pool.length));
      return out;
    }

    /* ---- entropy-based strength ---- */
    function updateStrength(pool, length) {
      var poolSize = pool.length;
      if (!poolSize) {
        barFill.style.width = '0'; barFill.style.background = 'var(--danger)';
        strLabel.innerHTML = '<span style="color:var(--danger)">Select at least one character set.</span>';
        return 0;
      }
      var bits = Math.round(length * Math.log2(poolSize));
      var pct = Math.max(4, Math.min(100, Math.round((bits / 128) * 100)));
      var rating, color;
      if (bits < 40)       { rating = 'Very weak';  color = 'var(--danger)'; }
      else if (bits < 60)  { rating = 'Weak';       color = 'var(--warning)'; }
      else if (bits < 80)  { rating = 'Good';       color = '#eab308'; }
      else if (bits < 112) { rating = 'Strong';     color = 'var(--success)'; }
      else                 { rating = 'Very strong';color = 'var(--success)'; }
      barFill.style.width = pct + '%';
      barFill.style.background = color;
      strLabel.innerHTML =
        '<span>Strength: <strong style="color:' + color + '">' + rating + '</strong></span>' +
        '<span>' + bits + ' bits · pool of ' + poolSize + ' chars</span>';
      return bits;
    }

    var current = [];
    function generate() {
      var pool = buildPool();
      var length = parseInt(lenEl.value, 10);
      updateStrength(pool, length);
      if (!pool) { current = []; results.innerHTML = ''; return; }

      var n = Math.max(1, Math.min(100, parseInt(countEl.value, 10) || 1));
      countEl.value = n;
      current = [];
      for (var i = 0; i < n; i++) current.push(makeOne(pool, length));
      renderResults();
    }

    function renderResults() {
      results.innerHTML = '';
      current.forEach(function (pw) {
        results.appendChild(el('li', {}, [
          el('i', { class: 'bi bi-key', style: 'color:var(--accent)' }),
          el('span', { text: pw }),
          el('button', {
            class: 'copy-inline', type: 'button', title: 'Copy',
            onclick: function () { Taste.copy(pw); }
          }, [ el('i', { class: 'bi bi-clipboard' }) ])
        ]));
      });
    }

    /* ---- actions ---- */
    var actions = {
      generate: generate,
      copyall:  function () { current.length ? Taste.copy(current.join('\n')) : Taste.toast('Generate first', 'info'); },
      download: function () { current.length ? Taste.download('taste-passwords.txt', current.join('\n')) : Taste.toast('Nothing to download', 'info'); }
    };
    Taste.on(root, 'click', '[data-act]', function (e, node) {
      var fn = actions[node.dataset.act]; if (fn) fn();
    });

    /* ---- live updates ---- */
    Taste.on(lenEl, 'input', function () {
      lenVal.textContent = lenEl.value;
      updateStrength(buildPool(), parseInt(lenEl.value, 10));
    });
    [upper, lower, digit, symbol, noAmbig].forEach(function (chk) {
      Taste.on(chk, 'change', function () {
        // guarantee at least one set stays on
        if (!buildPool()) { chk.checked = true; }
        generate();
      });
    });
    Taste.on(countEl, 'keydown', function (e) { if (e.key === 'Enter') generate(); });

    // First password on open
    lenVal.textContent = lenEl.value;
    generate();
  };
</script>
