<!-- =========================================================================
     Project Taste — tools/md5.html
     MD5 generator. Runs fully in the browser using a small pure-JS MD5
     implementation and the existing Taste tool contract.
     ========================================================================= -->

<div class="tool-header">
  <div class="tool-header-icon"><i class="bi bi-hash"></i></div>
  <div class="tool-header-text">
    <h1>MD5 Generator</h1>
    <p>Compute an MD5 digest for any text. Everything stays local in the browser.</p>
  </div>
</div>

<div class="tool-card-panel">
  <div class="tool-split">
    <div class="field">
      <label class="field-label" for="md5-input">Input</label>
      <textarea id="md5-input" class="textarea-taste" placeholder="Enter text to hash…" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label class="field-label" for="md5-output">MD5 Digest</label>
      <textarea id="md5-output" class="textarea-taste" placeholder="MD5 hash appears here…" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <div id="md5-status" class="jx-status" hidden></div>

  <div class="toolbar">
    <button class="btn-taste btn-taste-primary" data-act="hash"><i class="bi bi-hash"></i> Compute MD5</button>
    <button class="btn-taste btn-taste-success" data-act="copy"><i class="bi bi-clipboard-check"></i> Copy</button>
    <button class="btn-taste btn-taste-ghost" data-act="clear"><i class="bi bi-x-circle"></i> Clear</button>
  </div>
</div>

<style>
  .jx-status { padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3); border-radius: var(--radius-md);
    font-size: var(--fs-sm); font-weight: var(--fw-medium); display:flex; align-items:center; gap:var(--sp-2); }
  .jx-status.err { background: rgba(220,38,38,0.12); color: var(--danger); }
  .jx-status.ok  { background: var(--badge-new-bg); color: var(--badge-new-text); }
</style>

<script>
  window.TasteTools = window.TasteTools || {};
  window.TasteTools['md5'] = function (root, tool, Taste) {
    'use strict';

    const $ = Taste.$;
    const inputEl = $('#md5-input', root);
    const outputEl = $('#md5-output', root);
    const statusEl = $('#md5-status', root);
    const SAVE_KEY = 'tool:md5:input';

    function showStatus(kind, message) {
      statusEl.hidden = false;
      statusEl.className = 'jx-status ' + kind;
      statusEl.innerHTML = '';
      statusEl.appendChild(Taste.el('i', { class: 'bi ' + (kind === 'ok' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill') }));
      statusEl.appendChild(Taste.el('span', { text: message }));
    }

    function toUtf8Bytes(text) {
      return new TextEncoder().encode(text);
    }

    function safeAdd(x, y) {
      const lsw = (x & 0xffff) + (y & 0xffff);
      const msw = (x >>> 16) + (y >>> 16) + (lsw >>> 16);
      return (msw << 16) | (lsw & 0xffff);
    }

    function leftRotate(value, shift) {
      return (value << shift) | (value >>> (32 - shift));
    }

    function cmn(q, a, b, x, s, t) {
      return safeAdd(leftRotate(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b);
    }

    function ff(a, b, c, d, x, s, t) { return cmn((b & c) | ((~b) & d), a, b, x, s, t); }
    function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & (~d)), a, b, x, s, t); }
    function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
    function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | (~d)), a, b, x, s, t); }

    function bytesToWords(bytes) {
      const words = [];
      for (let i = 0; i < bytes.length; i += 4) {
        words[i >> 2] = bytes[i] | (bytes[i + 1] << 8) | (bytes[i + 2] << 16) | (bytes[i + 3] << 24);
      }
      return words;
    }

    function toHex(value) {
      let hex = '';
      for (let i = 0; i < 4; i++) {
        hex += ((value >>> (i * 8)) & 0xff).toString(16).padStart(2, '0');
      }
      return hex;
    }

    function md5Bytes(bytes) {
      const input = Array.from(bytes);
      const bitLength = input.length * 8;

      input.push(0x80);
      while (input.length % 64 !== 56) input.push(0);

      for (let i = 0; i < 8; i++) {
        input.push((bitLength >>> (8 * i)) & 0xff);
      }

      const words = bytesToWords(input);
      let a = 0x67452301;
      let b = 0xefcdab89;
      let c = 0x98badcfe;
      let d = 0x10325476;

      for (let i = 0; i < words.length; i += 16) {
        const oldA = a;
        const oldB = b;
        const oldC = c;
        const oldD = d;

        a = ff(a, b, c, d, words[i + 0], 7, 0xd76aa478);
        d = ff(d, a, b, c, words[i + 1], 12, 0xe8c7b756);
        c = ff(c, d, a, b, words[i + 2], 17, 0x242070db);
        b = ff(b, c, d, a, words[i + 3], 22, 0xc1bdceee);
        a = ff(a, b, c, d, words[i + 4], 7, 0xf57c0faf);
        d = ff(d, a, b, c, words[i + 5], 12, 0x4787c62a);
        c = ff(c, d, a, b, words[i + 6], 17, 0xa8304613);
        b = ff(b, c, d, a, words[i + 7], 22, 0xfd469501);
        a = ff(a, b, c, d, words[i + 8], 7, 0x698098d8);
        d = ff(d, a, b, c, words[i + 9], 12, 0x8b44f7af);
        c = ff(c, d, a, b, words[i + 10], 17, 0xffff5bb1);
        b = ff(b, c, d, a, words[i + 11], 22, 0x895cd7be);
        a = ff(a, b, c, d, words[i + 12], 7, 0x6b901122);
        d = ff(d, a, b, c, words[i + 13], 12, 0xfd987193);
        c = ff(c, d, a, b, words[i + 14], 17, 0xa679438e);
        b = ff(b, c, d, a, words[i + 15], 22, 0x49b40821);

        a = gg(a, b, c, d, words[i + 1], 5, 0xf61e2562);
        d = gg(d, a, b, c, words[i + 6], 9, 0xc040b340);
        c = gg(c, d, a, b, words[i + 11], 14, 0x265e5a51);
        b = gg(b, c, d, a, words[i + 0], 20, 0xe9b6c7aa);
        a = gg(a, b, c, d, words[i + 5], 5, 0xd62f105d);
        d = gg(d, a, b, c, words[i + 10], 9, 0x02441453);
        c = gg(c, d, a, b, words[i + 15], 14, 0xd8a1e681);
        b = gg(b, c, d, a, words[i + 4], 20, 0xe7d3fbc8);
        a = gg(a, b, c, d, words[i + 9], 5, 0x21e1cde6);
        d = gg(d, a, b, c, words[i + 14], 9, 0xc33707d6);
        c = gg(c, d, a, b, words[i + 3], 14, 0xf4d50d87);
        b = gg(b, c, d, a, words[i + 8], 20, 0x455a14ed);
        a = gg(a, b, c, d, words[i + 13], 5, 0xa9e3e905);
        d = gg(d, a, b, c, words[i + 2], 9, 0xfcefa3f8);
        c = gg(c, d, a, b, words[i + 7], 14, 0x676f02d9);
        b = gg(b, c, d, a, words[i + 12], 20, 0x8d2a4c8a);

        a = hh(a, b, c, d, words[i + 5], 4, 0xfffa3942);
        d = hh(d, a, b, c, words[i + 8], 11, 0x8771f681);
        c = hh(c, d, a, b, words[i + 11], 16, 0x6d9d6122);
        b = hh(b, c, d, a, words[i + 14], 23, 0xfde5380c);
        a = hh(a, b, c, d, words[i + 1], 4, 0xa4beea44);
        d = hh(d, a, b, c, words[i + 4], 11, 0x4bdecfa9);
        c = hh(c, d, a, b, words[i + 7], 16, 0xf6bb4b60);
        b = hh(b, c, d, a, words[i + 10], 23, 0xbebfbc70);
        a = hh(a, b, c, d, words[i + 13], 4, 0x289b7ec6);
        d = hh(d, a, b, c, words[i + 0], 11, 0xeaa127fa);
        c = hh(c, d, a, b, words[i + 3], 16, 0xd4ef3085);
        b = hh(b, c, d, a, words[i + 6], 23, 0x04881d05);
        a = hh(a, b, c, d, words[i + 9], 4, 0xd9d4d039);
        d = hh(d, a, b, c, words[i + 12], 11, 0xe6db99e5);
        c = hh(c, d, a, b, words[i + 15], 16, 0x1fa27cf8);
        b = hh(b, c, d, a, words[i + 2], 23, 0xc4ac5665);

        a = ii(a, b, c, d, words[i + 0], 6, 0xf4292244);
        d = ii(d, a, b, c, words[i + 7], 10, 0x432aff97);
        c = ii(c, d, a, b, words[i + 14], 15, 0xab9423a7);
        b = ii(b, c, d, a, words[i + 5], 21, 0xfc93a039);
        a = ii(a, b, c, d, words[i + 12], 6, 0x655b59c3);
        d = ii(d, a, b, c, words[i + 3], 10, 0x8f0ccc92);
        c = ii(c, d, a, b, words[i + 10], 15, 0xffeff47d);
        b = ii(b, c, d, a, words[i + 1], 21, 0x85845dd1);
        a = ii(a, b, c, d, words[i + 8], 6, 0x6fa87e4f);
        d = ii(d, a, b, c, words[i + 15], 10, 0xfe2ce6e0);
        c = ii(c, d, a, b, words[i + 6], 15, 0xa3014314);
        b = ii(b, c, d, a, words[i + 13], 21, 0x4e0811a1);
        a = ii(a, b, c, d, words[i + 4], 6, 0xf7537e82);
        d = ii(d, a, b, c, words[i + 11], 10, 0xbd3af235);
        c = ii(c, d, a, b, words[i + 2], 15, 0x2ad7d2bb);
        b = ii(b, c, d, a, words[i + 9], 21, 0xeb86d391);

        a = safeAdd(a, oldA);
        b = safeAdd(b, oldB);
        c = safeAdd(c, oldC);
        d = safeAdd(d, oldD);
      }

      return toHex(a) + toHex(b) + toHex(c) + toHex(d);
    }

    function computeHash() {
      const input = inputEl.value;
      outputEl.value = input ? md5Bytes(toUtf8Bytes(input)) : '';
      if (outputEl.value) {
        showStatus('ok', 'MD5 digest computed');
      } else {
        showStatus('err', 'Enter text to hash');
      }
    }

    const actions = {
      hash: computeHash,
      copy: function () { Taste.copy(outputEl.value); },
      clear: function () {
        inputEl.value = '';
        outputEl.value = '';
        statusEl.hidden = true;
        Taste.store.remove(SAVE_KEY);
      }
    };

    Taste.on(root, 'click', '[data-act]', function (event, node) {
      event.preventDefault();
      const action = actions[node.dataset.act];
      if (action) action();
    });

    Taste.on(inputEl, 'input', Taste.debounce(function () {
      Taste.store.set(SAVE_KEY, inputEl.value);
    }, 300));

    Taste.on(inputEl, 'keydown', function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        computeHash();
      }
    });

    const saved = Taste.store.get(SAVE_KEY, '');
    if (saved) inputEl.value = saved;
    inputEl.focus();
  };
</script>
